<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form đăng ký việc làm</title>
</head>
<body>
  <h1>
    Đăng ký thông tin việc làm
  </h1>
  <p>
    Họ và Tên
  </p>
  <input type="text" name="" id="">
  <p>
    Ngày tháng năm sinh
  </p>
  <input type="date">
  <p>
    Email
  </p>
  <input type="email">
  <p>
    Giới tính
  </p>
  <select name="" id="">
    <option value="Nam">Nam</option>
    <option value="Nữ">Nữ</option>
    <option value="GAY">GAY</option>
  </select>
  <p>
    Giới thiệu bản thân
  </p>
  <textarea name="" id=""></textarea>
  <p>
    Trình độ lập trình
    <input type="radio" name="code-lever" value="Thấp">Thấp
    <input type="radio" name="code-lever" value="Trung Binh">Trung Binh
    <input type="radio" name="code-lever" value="Cao">Cao
    </p>
    Đồng ý và chia sẻ thông tin
    <p>
        <input type="checkbox">Đồng ý
    </p>
    <h1>
        <button>
            Gửi thông tin
        </button>
    </h1>
</body>
</html>
